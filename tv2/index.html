<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futuristic IPTV Portal</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-purple: #bc13fe;
            --bg-dark: #020617;
            --glass: rgba(15, 23, 42, 0.8);
            --text-glow: 0 0 10px rgba(0, 243, 255, 0.5);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Orbitron', 'Segoe UI', sans-serif;
            background-color: var(--bg-dark);
            background-image:
                radial-gradient(at 0% 0%, rgba(188, 19, 254, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(0, 243, 255, 0.15) 0px, transparent 50%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        .container {
            width: 95%;
            max-width: 1200px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            text-align: center;
        }

        .logo {
            width: 80px;
            height: 80px;
            filter: drop-shadow(0 0 15px var(--neon-cyan));
            animation: pulse 2s infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(1); opacity: 0.8; }
            to { transform: scale(1.1); opacity: 1; }
        }

        h1 {
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            color: var(--neon-cyan);
            text-shadow: var(--text-glow);
        }

        /* Controls Area */
        .controls-card {
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
        }

        .select-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        label {
            font-size: 0.7rem;
            color: var(--neon-cyan);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-left: 5px;
        }

        select {
            width: 100%;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--neon-purple);
            color: #fff;
            padding: 12px;
            border-radius: 12px;
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
            font-family: inherit;
        }

        select option { background: var(--bg-dark); color: #fff; }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.3s;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }

        .btn-native { background: linear-gradient(45deg, #1e40af, #3b82f6); color: white; }
        .btn-vlc { background: linear-gradient(45deg, #ea580c, #f97316); color: white; }

        .btn:hover { transform: scale(1.02); filter: brightness(1.2); }

        /* Player Area */
        .player-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid var(--neon-cyan);
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.2);
        }

        video { width: 100%; height: 100%; }

        .status-bar {
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 0.8rem;
            color: var(--neon-cyan);
            border: 1px solid rgba(0, 243, 255, 0.3);
            text-align: center;
        }

        @media (max-width: 600px) {
            .btn-group { flex-direction: column; }
            h1 { font-size: 1.2rem; letter-spacing: 2px; }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>

    <div class="container">

        </header>

        <div class="controls-card">

            </div>

            <div class="btn-group">

                <button class="btn btn-vlc" onclick="openVLC()"><i class="fas fa-external-link-alt"></i> ABRIR EN VLC</button>
            </div>
        </div>

        <div id="status" class="status-bar">SISTEMA INICIALIZADO. SELECCIONE UNA SEÑAL.</div>

        <div class="player-wrapper">
            <video id="video" controls autoplay playsinline></video>

        function parseM3U(data) {
            const lines = data.split('\n');
            const channels = [];
            let currentName = "";
            for (let line of lines) {
                line = line.trim();
                if (line.startsWith('#EXTINF')) {
                    const commaIndex = line.indexOf(',');
                    currentName = commaIndex !== -1 ? line.substring(commaIndex + 1) : "Unknown";
                } else if (line.startsWith('http')) {
                    channels.push({ name: currentName, url: line });
                }
            }
            return channels;
        }

        const intlList = parseM3U(intlM3u);
        const itList = parseM3U(itM3u);

        const intlSelect = document.getElementById('channelSelect');
        const itSelect = document.getElementById('italiaSelect');

        intlList.forEach(ch => {
            const opt = document.createElement('option');
            opt.value = ch.url;
            opt.textContent = ch.name;
            intlSelect.appendChild(opt);
        });

        itList.forEach(ch => {
            const opt = document.createElement('option');
            opt.value = ch.url;
            opt.textContent = ch.name;
            itSelect.appendChild(opt);
        });

        let hls;
        const video = document.getElementById('video');
        let currentUrl = "";

        function updateSelection(type) {
            if (type === 'intl') {
                itSelect.value = "";
                currentUrl = intlSelect.value;
                const name = intlSelect.options[intlSelect.selectedIndex].text;
                document.getElementById('status').textContent = "SELECCIONADO: " + name;
            } else {
                intlSelect.value = "";
                currentUrl = itSelect.value;
                const name = itSelect.options[itSelect.selectedIndex].text;
                document.getElementById('status').textContent = "SELECCIONADO (ITALIA): " + name;
            }
        }

        function playNative() {
            if (!currentUrl) return;

            document.getElementById('status').textContent = "CONECTANDO SEÑAL...";

            if (hls) hls.destroy();

            if (Hls.isSupported()) {
                hls = new Hls();
                hls.loadSource(currentUrl);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = currentUrl;
                video.play();
            } else {
                video.src = currentUrl;
                video.play().catch(e => {
                    document.getElementById('status').textContent = "ERROR DE FORMATO. RECOMENDADO VLC.";
                });
            }
        }

        function openVLC() {
            if (!currentUrl) return;
            window.location.href = "vlc://" + currentUrl;
        }
