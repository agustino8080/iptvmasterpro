<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>IPTV MASTER — Centro Multimedia</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.15/hls.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.min.js"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0A0D12; --bg-raised:#12161D; --bg-inset:#0D1016; --line:#222834;
    --amber:#F5A623; --teal:#35D0BA; --text:#E7E4DC; --live:#E5484D;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background: var(--bg); color:var(--text);
    font-family:'IBM Plex Sans', sans-serif; overflow:hidden; height:100vh;
  }
  .app{ height:100vh; display:grid; grid-template-rows:auto 1fr; }
  header{
    display:flex; align-items:center; padding:10px 20px;
    background: var(--bg-raised); border-bottom:1px solid var(--line); gap:15px;
  }
  h1{ font-family:'Bebas Neue'; font-size:24px; color:var(--amber); letter-spacing:2px; margin:0; }

  .search-box{ flex:1; position:relative; max-width:500px; }
  .search-box input{
    width:100%; background:var(--bg-inset); border:1px solid var(--line);
    padding:8px 15px 8px 35px; border-radius:20px; color:white; outline:none;
  }
  .search-box i{ position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--text); font-size:12px; }

  .layout{ display:grid; grid-template-columns:300px 1fr; overflow:hidden; }

  aside{
    background:var(--bg-raised); border-right:1px solid var(--line);
    padding:15px; display:flex; flex-direction:column; gap:15px; overflow-y:auto;
  }
  .select-block{ display:flex; flex-direction:column; gap:5px; }
  label{ font-size:10px; text-transform:uppercase; color:var(--amber); font-weight:bold; }
  select{
    background:var(--bg-inset); border:1px solid var(--line); color:white;
    padding:8px; border-radius:8px; font-size:12px; outline:none; cursor:pointer;
  }

  main{ background:#000; display:flex; flex-direction:column; position:relative; }
  .player-container{ flex:1; position:relative; display:flex; align-items:center; justify-content:center; }
  video{ width:100%; height:100%; object-fit:contain; }

  .action-bar{
    padding:15px; background:var(--bg-raised); border-top:1px solid var(--line);
    display:flex; gap:10px;
  }
  .btn{
    flex:1; padding:12px; border-radius:10px; border:none; font-weight:bold;
    display:flex; align-items:center; justify-content:center; gap:8px;
    text-transform:uppercase; font-size:12px; cursor:pointer; color:white;
  }
  .btn-native{ background: linear-gradient(45deg, #1e40af, #3b82f6); }
  .btn-vlc{ background: linear-gradient(45deg, #ea580c, #f97316); }

  .status-tag{ position:absolute; top:10px; left:10px; background:rgba(0,0,0,0.7); padding:5px 10px; border-radius:5px; font-size:10px; color:var(--teal); border:1px solid var(--teal); }

  @media(max-width:800px){ .layout{ grid-template-columns:1fr; } aside{ display:none; } }
</style>
</head>
<body>

<div class="app">
  <header>
    <h1>IPTV MASTER <span>PRO</span></h1>
    <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="BUSCAR CANAL EN TODOS LOS SERVIDORES..." oninput="filterChannels()">
    </div>
  </header>

  <div class="layout">
    <aside>
      <div class="select-block">
        <label>Servidor Maestro</label>
        <select id="serverSelect" onchange="loadServer()">
          <option value="">-- ELIGE UN SERVIDOR --</option>
          <option value="lat1">LATINO 1 (VIPS)</option>
          <option value="lat2">LATINO 2 (OLE)</option>
          <option value="lat3">LATINO 3 (CENTRAL)</option>
          <option value="lat5">LATINO 5 (MIXTO)</option>
          <option value="esp">ESPAÑA TV</option>
          <option value="fra">FRANCE & EURO</option>
          <option value="rb">REDBULL SPORTS</option>
        </select>
      </div>

      <div class="select-block">
        <label>Lista de Canales</label>
        <select id="channelSelect" onchange="selectChannel()"></select>
      </div>

      <div style="font-size:10px; color:gray; margin-top:auto;">
        Soporte: HLS, DASH, TS, FLV <br>
        Buffer: 30s Optimizado
      </div>
    </aside>

    <main>
      <div class="status-tag" id="status">SISTEMA INICIADO</div>
      <div class="player-container">
        <video id="video" controls autoplay></video>
      </div>
      <div class="action-bar">
        <button class="btn btn-native" onclick="playCurrent()"><i class="fas fa-play"></i> WEB PLAYER</button>
        <button class="btn btn-vlc" onclick="openVLC()"><i class="fas fa-external-link-alt"></i> VLC EXTERNAL</button>
      </div>
    </main>
  </div>
</div>

<script>
  const servers = {
    lat1: `24 HORAS,http://186.148.196.250:81/play/a0no/index.m3u8|A&E HD,http://186.148.196.250:81/play/a03a/index.m3u8|AMC HD,http://186.148.196.250:81/play/a0ii/index.m3u8|Animal Planet HD,http://186.148.196.250:81/play/a04c/index.m3u8|ESPN 2 HD,http://186.148.196.250:81/play/a0id/index.m3u8|GOLPERU HD,http://186.148.196.82:8001/play/golperu|LIGA 1 MAX,http://186.148.196.82:8001/play/ligamax1`,
    lat2: `A&E HD OLE,http://179.63.6.209:8000/play/a006|AXN HD OLE,http://179.63.6.209:8000/play/a007|ESPN 6 HD,http://179.63.6.209:8000/play/a095|LIGA 1 MAX HD,http://179.63.6.209:8000/play/a0cr|WILLAX HD,http://179.63.5.46:8000/play/a06e/index.m3u8`,
    lat3: `A&E HD 177,http://177.10.184.193:8000/play/a0cz/index.m3u8|AMC HD 177,http://177.10.184.193:8000/play/a0d0/index.m3u8|HBO HD 177,http://177.10.184.193:8000/play/a0gg/index.m3u8|AZTECA 7,http://177.10.184.60:8002/play/a00o/index.m3u8`,
    lat5: `BTV,http://103.165.93.31:8095/btv/index.m3u8|SABC 3,http://195.128.27.177/SABC3/index.m3u8|AMC HD,http://45.235.37.228/amchd/index.m3u8|Boing,http://185.47.212.25/Boing/index.m3u8|SBT,http://200.77.176.130/SBT/index.m3u8`,
    esp: `La 1,http://79.112.79.166:8069/udp/239.10.20.5:1234|Antena 3,http://79.112.79.166:8069/udp/239.10.20.9:1234|Telecinco,http://79.112.79.166:8069/udp/239.10.20.19:1234`,
    fra: `FRANCE 24,http://5.180.164.197:8080/FRANCE24EN/index.m3u8|CNN,http://5.180.164.197:8080/CNN/index.m3u8|ZDF,http://5.180.164.197:8080/ZDF/index.m3u8`,
    rb: `Red Bull AU,https://db34cc6127ac459db55cab5f97cd66b9.mediatailor.us-west-2.amazonaws.com/v1/master/ba62fe743df0fe93366eba3a257d792884136c7f/LINEAR-680-WORBAUENFAST-WHALETVPLUS/680/whaletvplus/hls/master/playlist.m3u8`
  };

  let currentUrl = "";
  let hls;
  let mpegts;
  const video = document.getElementById('video');

  function loadServer() {
    const val = document.getElementById('serverSelect').value;
    const chanSel = document.getElementById('channelSelect');
    chanSel.innerHTML = '<option value="">-- ELIGE CANAL --</option>';
    if(!val) return;

    servers[val].split('|').forEach(item => {
      const [name, url] = item.split(',');
      const opt = document.createElement('option');
      opt.value = url; opt.textContent = name;
      chanSel.appendChild(opt);
    });
  }

  function filterChannels() {
    const query = document.getElementById('searchInput').value.toLowerCase();
    if(query.length < 2) return;
    const chanSel = document.getElementById('channelSelect');
    chanSel.innerHTML = '<option value="">-- RESULTADOS --</option>';

    Object.values(servers).forEach(list => {
        list.split('|').forEach(item => {
            const [name, url] = item.split(',');
            if(name.toLowerCase().includes(query)) {
                const opt = document.createElement('option');
                opt.value = url; opt.textContent = name;
                chanSel.appendChild(opt);
            }
        });
    });
  }

  function selectChannel() {
    currentUrl = document.getElementById('channelSelect').value;
    const name = document.getElementById('channelSelect').options[document.getElementById('channelSelect').selectedIndex].text;
    document.getElementById('status').textContent = "SELECCIONADO: " + name;
    playCurrent();
  }

  function playCurrent() {
    if(!currentUrl) return;
    if(hls) hls.destroy();
    if(mpegts) mpegts.destroy();

    if(currentUrl.includes('.m3u8')) {
        if(Hls.isSupported()) {
            hls = new Hls({maxBufferLength: 30});
            hls.loadSource(currentUrl);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
        } else {
            video.src = currentUrl;
            video.play();
        }
    } else if (currentUrl.includes('.ts') || currentUrl.includes(':8001') || currentUrl.includes(':8069')) {
        if(mpegts.isSupported()) {
            mpegts = mpegts.createPlayer({type: 'mpegts', isLive: true, url: currentUrl});
            mpegts.attachMediaElement(video);
            mpegts.load();
            mpegts.play();
        }
    } else {
        video.src = currentUrl;
        video.play();
    }
  }

  function openVLC() {
    if(currentUrl) window.location.href = "vlc://" + currentUrl;
  }
</script>
</body>
</html>
