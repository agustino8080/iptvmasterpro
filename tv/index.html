<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV Master - Portal Premium</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --primary: #00f2ff; --bg: #050a14; --card: #111827; --text: #f1f5f9; --accent: #7c3aed; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; overflow: hidden; }

        .layout { display: flex; height: 100vh; width: 100vw; }

        /* Sidebar */
        .sidebar { width: 350px; background: var(--card); border-right: 1px solid #1e293b; display: flex; flex-direction: column; transition: 0.3s; z-index: 200; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid #1e293b; }
        .sidebar-header h2 { margin: 0; color: var(--primary); font-size: 1.2rem; display: flex; align-items: center; gap: 10px; }

        .search-box { margin-top: 15px; position: relative; }
        .search-box input { width: 100%; background: #0b0f1a; border: 1px solid #334155; padding: 10px 35px 10px 15px; border-radius: 8px; color: white; outline: none; box-sizing: border-box; }
        .search-box i { position: absolute; right: 10px; top: 12px; color: #64748b; }

        .categories { display: flex; gap: 5px; padding: 10px 20px; overflow-x: auto; white-space: nowrap; border-bottom: 1px solid #1e293b; }
        .cat-tag { padding: 5px 12px; background: #1e293b; border-radius: 20px; font-size: 11px; cursor: pointer; border: 1px solid transparent; }
        .cat-tag.active { background: rgba(0, 242, 255, 0.1); border-color: var(--primary); color: var(--primary); }

        .channel-list { flex: 1; overflow-y: auto; padding: 10px; scrollbar-width: thin; scrollbar-color: var(--primary) transparent; }
        .channel-item { display: flex; align-items: center; padding: 12px; border-radius: 10px; cursor: pointer; margin-bottom: 5px; transition: 0.2s; border: 1px solid transparent; }
        .channel-item:hover { background: rgba(255,255,255,0.05); }
        .channel-item.active { background: rgba(0, 242, 255, 0.1); border-color: var(--primary); }
        .channel-icon { width: 35px; height: 35px; background: #1e293b; border-radius: 8px; display: flex; align-items: center; justify-content: center; margin-right: 12px; color: var(--primary); }
        .channel-info { flex: 1; overflow: hidden; }
        .channel-name { font-size: 13px; font-weight: 600; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .channel-cat { font-size: 10px; color: #64748b; text-transform: uppercase; }

        /* Main Player */
        .main { flex: 1; display: flex; flex-direction: column; background: #000; position: relative; }
        .player-toolbar { height: 50px; background: rgba(15, 23, 42, 0.9); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 1px solid #1e293b; z-index: 100; }
        .current-channel { font-weight: bold; color: var(--primary); display: flex; align-items: center; gap: 10px; font-size: 14px; }

        .player-container { flex: 1; position: relative; width: 100%; height: 100%; }
        iframe { width: 100%; height: 100%; border: none; }

        /* Interaction Shield */
        #interactionShield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            background: rgba(0,0,0,0.01);
            cursor: pointer;
            display: none;
        }

        .unlock-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--primary);
            color: #000;
            padding: 15px 25px;
            border-radius: 50px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.5);
        }

        .btn-action { background: #1e293b; border: none; color: white; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; display: flex; align-items: center; gap: 5px; }
        .btn-action:hover { background: #334155; color: var(--primary); }

        @media (max-width: 800px) {
            .sidebar { width: 100%; position: absolute; height: 100%; left: -100%; }
            .sidebar.open { left: 0; }
        }
    </style>
</head>

<div class="layout">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2><i class="fas fa-bolt"></i> IPTV MASTER PRO</h2>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Buscar entre 130+ canales..." onkeyup="filterChannels()">
                <i class="fas fa-search"></i>
            </div>
        </div>
        <div class="categories" id="catFilter">
            <div class="cat-tag active" onclick="filterByCategory('all')">Todos</div>
            <div class="cat-tag" onclick="filterByCategory('Deportes')">Deportes</div>
            <div class="cat-tag" onclick="filterByCategory('Entretenimiento')">Cine/TV</div>
            <div class="cat-tag" onclick="filterByCategory('Dibujos animados')">Niños</div>
        </div>
        <div class="channel-list" id="channelList"></div>
    </aside>

    <main class="main">
        <div class="player-toolbar">
            <div class="current-channel" id="activeTitle">
                <i class="fas fa-broadcast-tower"></i> SELECCIONA UN CANAL
            </div>
            <div style="display: flex; gap: 8px;">
                <button class="btn-action" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
                <button class="btn-action" onclick="refreshPlayer()"><i class="fas fa-sync"></i></button>
                <button class="btn-action" onclick="toggleFull()"><i class="fas fa-expand"></i></button>
            </div>
        </div>

        <div class="player-container">
            <div id="interactionShield" onclick="this.style.display='none'">
                <div class="unlock-btn"><i class="fas fa-play"></i> INICIAR REPRODUCCIÓN</div>
            </div>
            <iframe id="player" src="about:blank" sandbox="allow-scripts allow-same-origin allow-autoplay allow-presentation allow-fullscreen" allowfullscreen></iframe>
        </div>
    </main>
</div>

    function renderChannels(data) {
        const list = document.getElementById('channelList');
        list.innerHTML = '';
        data.sort((a, b) => a.name.localeCompare(b.name)).forEach(ch => {
            const item = document.createElement('div');
            item.className = 'channel-item';
            item.innerHTML = `
                <div class="channel-icon"><i class="fas fa-play"></i></div>
                <div class="channel-info">
                    <span class="channel-name">${ch.name}</span>
                    <span class="channel-cat">${ch.cat}</span>
                </div>
            `;
            item.onclick = (e) => playChannel(ch, e);
            list.appendChild(item);
        });
    }

    function playChannel(ch, event) {
        const player = document.getElementById('player');
        const shield = document.getElementById('interactionShield');

        player.src = `https://logic.icelanders.st/embed/${ch.slug}`;
        shield.style.display = 'block';

        document.getElementById('activeTitle').innerHTML = `<i class="fas fa-dot-circle" style="color:#ff4b2b"></i> EN VIVO: ${ch.name}`;
        document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
        if (event && event.currentTarget) event.currentTarget.classList.add('active');

        if (window.innerWidth < 800) toggleSidebar();
    }

    function filterChannels() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        renderChannels(channels.filter(c => c.name.toLowerCase().includes(query)));
    }

    function filterByCategory(cat) {
        document.querySelectorAll('.cat-tag').forEach(t => t.classList.remove('active'));
        if (event && event.target) event.target.classList.add('active');
        if (cat === 'all') renderChannels(channels);
        else renderChannels(channels.filter(c => c.cat === (cat === 'Cine/TV' ? 'Entretenimiento' : (cat === 'Niños' ? 'Dibujos animados' : cat))));
    }

    function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }
    function refreshPlayer() { const s = document.getElementById('player').src; document.getElementById('player').src = s; }
    function toggleFull() { document.documentElement.requestFullscreen(); }

    window.onload = () => renderChannels(channels);
