<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ULTRA HUB MASTER PRO</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-purple: #bc13fe;
            --bg-dark: #020617;
            --glass: rgba(15, 23, 42, 0.9);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Orbitron', 'Segoe UI', sans-serif;
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at center, #1e1b4b 0%, #020617 100%);
            color: #fff;
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center; padding-bottom: 50px;
        }

        .header {
            width: 100%; text-align: center; padding: 20px; background: var(--glass);
            border-bottom: 2px solid var(--neon-cyan); box-shadow: 0 5px 20px rgba(0,243,255,0.2);
            margin-bottom: 20px;
        }
        .logo { width: 60px; filter: drop-shadow(0 0 10px var(--neon-cyan)); }
        h1 { font-size: 1.1rem; color: var(--neon-cyan); letter-spacing: 4px; text-transform: uppercase; margin-top: 10px; }

        /* Grid Multilista */
        .controls-grid {
            width: 95%; max-width: 1400px; display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px; padding: 20px; background: var(--glass);
            border-radius: 25px; border: 1px solid rgba(255,255,255,0.1);
        }

        .select-group { display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 0.6rem; color: var(--neon-cyan); text-transform: uppercase; letter-spacing: 1px; padding-left: 5px; }

        select {
            background: rgba(0,0,0,0.7); border: 1px solid var(--neon-purple); color: #fff;
            padding: 10px; border-radius: 12px; font-size: 0.75rem; outline: none; cursor: pointer;
            transition: 0.3s;
        }
        select:focus { border-color: var(--neon-cyan); box-shadow: 0 0 15px rgba(0,243,255,0.3); }

        /* Area de Reproducción */
        .player-container {
            width: 95%; max-width: 1200px; margin-top: 20px;
            display: flex; flex-direction: column; gap: 15px;
        }

        .player-wrapper {
            width: 100%; aspect-ratio: 16/9; background: #000;
            border-radius: 20px; overflow: hidden; border: 1px solid var(--neon-cyan);
            position: relative; box-shadow: 0 0 40px rgba(0,0,0,0.8);
        }
        video { width: 100%; height: 100%; }

        .shield {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 100;
            background: rgba(0,0,0,0.01); display: none; cursor: pointer;
            align-items: center; justify-content: center;
        }
        .shield-btn { background: var(--neon-cyan); color: #000; padding: 15px 30px; border-radius: 50px; font-weight: bold; }

        .btn-group { display: flex; gap: 10px; }
        .btn {
            flex: 1; padding: 15px; border: none; border-radius: 15px; font-weight: bold;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            color: white; text-transform: uppercase; cursor: pointer; transition: 0.3s;
        }
        .btn-play { background: linear-gradient(45deg, #1e40af, #3b82f6); }
        .btn-vlc { background: linear-gradient(45deg, #ea580c, #f97316); }
        .btn:hover { transform: translateY(-3px); filter: brightness(1.2); }

        #status { font-size: 0.7rem; color: var(--neon-cyan); text-align: center; opacity: 0.8; }

        @media (max-width: 600px) { .btn-group { flex-direction: column; } }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="header">
        <img src="https://cdn-icons-png.flaticon.com/512/716/716429.png" class="logo">
        <h1>ULTRA HUB MASTER</h1>
    </div>

    <div class="controls-grid" id="masterGrid">
        <!-- Generación dinámica de los 13 selects -->
    </div>

    <div class="player-container">
        <div id="status">SISTEMA CONECTADO. SELECCIONE UNA FUENTE...</div>

        <div class="player-wrapper">
            <div id="interactionShield" class="shield" onclick="unlockVideo()">
                <div class="shield-btn"><i class="fas fa-play-circle"></i> EMPEZAR STREAMING</div>
            </div>
            <video id="video" controls autoplay playsinline></video>
        </div>

        <div class="btn-group">
            <button class="btn btn-play" onclick="playNative()"><i class="fas fa-satellite-dish"></i> REPRODUCIR</button>
            <button class="btn btn-vlc" onclick="openVLC()"><i class="fas fa-external-link-alt"></i> ABRIR EN VLC</button>
        </div>
    </div>

    <script>
        const playlists = {
            "Latino 1": `24 HORAS,http://186.148.196.250:81/play/a0no/index.m3u8|A&E HD,http://186.148.196.250:81/play/a03a/index.m3u8|AMC HD,http://186.148.196.250:81/play/a0ii/index.m3u8|Animal Planet HD,http://186.148.196.250:81/play/a04c/index.m3u8|ESPN 2 HD,http://186.148.196.250:81/play/a0id/index.m3u8|FOX HD,http://186.148.196.250:81/play/a09i/index.m3u8|HBO HD,http://186.148.196.250:81/play/a0ik/index.m3u8|GOLPERU HD,http://186.148.196.82:8001/play/golperu|LIGA 1 MAX,http://186.148.196.82:8001/play/ligamax1`,

            "Latino 2": `A&E HD (OLE),http://179.63.6.209:8000/play/a006|AXN HD (OLE),http://179.63.6.209:8000/play/a007|ESPN 6 HD,http://179.63.6.209:8000/play/a095|LIGA 1 MAX HD,http://179.63.6.209:8000/play/a0cr|AMC HD,http://179.63.6.209:8000/play/a0ao|HBO HD,http://179.63.6.209:8000/play/a088|WILLAX HD,http://179.63.5.46:8000/play/a06e/index.m3u8|GLOBAL HD,http://179.63.5.46:8000/play/a06c/index.m3u8`,

            "Latino 3": `A&E HD,http://177.10.184.193:8000/play/a0cz/index.m3u8|AMC HD,http://177.10.184.193:8000/play/a0d0/index.m3u8|AXN HD,http://177.10.184.193:8000/play/a060/index.m3u8|ESPN 2 HD,http://177.10.184.193:8000/play/a0db/index.m3u8|HBO HD,http://177.10.184.193:8000/play/a0gg/index.m3u8|MC AZTECA 7,http://177.10.184.60:8002/play/a00o/index.m3u8|MC CANAL 5,http://177.10.184.60:8002/play/a00s/index.m3u8`,

            "Latino 6": `24 HORAS PRO,http://186.148.196.250:81/play/a0no/index.m3u8|AMC PRO,http://186.148.196.250:81/play/a0ho/index.m3u8|DSports,http://186.148.196.250:81/play/a0o4/index.m3u8|Sony HD,http://186.148.196.250:81/play/a04j/index.m3u8|TyC Sports,http://186.148.196.82:8001/play/a0ar`,

            "Latino 7": `Animal Planet,http://190.83.85.68/animal_planet/index.m3u8|HBO 2,http://190.83.85.68/hbo2/index.m3u8|ESPN 2,http://190.83.85.68/espn2/index.m3u8|TUDN,http://190.83.2.182:8090/TUDN/index.m3u8|Univision,http://190.83.2.182:8090/Univision/index.m3u8`,

            "Latino 8": `AnimalPlanet HD,http://45.190.13.8/AnimalPlanetHD/index.m3u8|AXN HD,http://45.190.13.8/AXNHD/index.m3u8|NatGeo HD,http://45.190.13.8/NatGeoHD/index.m3u8|Universal TV,http://45.190.13.8/UniversalTV/index.m3u8|HTV,http://45.190.13.8/HTV/index.m3u8`,

            "Latino 9": `TELESUR HD,http://45.167.2.138:8000/play/a0lg/index.m3u8|AMC SERIES,http://45.167.2.138:8000/play/a0t0/index.m3u8|FOX SPORT,http://45.167.2.138:8000/play/a0ql/index.m3u8|HBO 2,http://45.167.2.138:8000/play/a0lp/index.m3u8|Disney 7,http://45.167.1.138:8000/play/a030`,

            "Latino 10": `BabyFirst,http://45.181.121.85:25461/test/test/2|AMC Series,http://45.181.121.85:25461/test/test/24|ESPN 2,http://45.181.121.85:25461/test/test/66|Sony HD,http://45.181.122.46:8090/play/a00e|Warner HD,http://45.181.122.46:8090/play/a00f`,

            "Italy 2": `3SAT,http://5.180.164.197:8080/3SAT/index.m3u8|CNBC,http://5.180.164.197:8080/CNBC/index.m3u8|CNN,http://5.180.164.197:8080/CNN/index.m3u8|RTL,http://5.180.164.197:8080/RTL/index.m3u8|ZDF,http://5.180.164.197:8080/ZDF/index.m3u8`,

            "France": `FRANCE 24 EN,http://5.180.164.197:8080/FRANCE24EN/index.m3u8|FRANCE 24 FR,http://5.180.164.197:8080/FRANCE24FR/index.m3u8|TV5MONDE,http://5.180.164.197:8080/TV5MONDE/index.m3u8`,

            "España": `La 1,http://79.112.79.166:8069/udp/239.10.20.5:1234|Antena 3,http://79.112.79.166:8069/udp/239.10.20.9:1234|Telecinco,http://79.112.79.166:8069/udp/239.10.20.19:1234|Real Madrid TV,http://79.112.79.166:8069/udp/239.10.20.37:1234`,

            "TelRedBull": `Red Bull AU,https://db34cc6127ac459db55cab5f97cd66b9.mediatailor.us-west-2.amazonaws.com/v1/master/ba62fe743df0fe93366eba3a257d792884136c7f/LINEAR-680-WORBAUENFAST-WHALETVPLUS/680/whaletvplus/hls/master/playlist.m3u8|Red Bull BR,https://d03ae6b5c6724c24867e97a3dc04934a.mediatailor.us-west-2.amazonaws.com/v1/master/ba62fe743df0fe93366eba3a257d792884136c7f/LINEAR-1026-WORBBRPTFAST-WHALETVPLUS/1026/hls/master/playlist.m3u8`
        };

        const grid = document.getElementById('masterGrid');
        let currentUrl = "";
        let hls;
        const video = document.getElementById('video');

        // Renderizar todos los Selects
        Object.keys(playlists).forEach((name, i) => {
            const group = document.createElement('div');
            group.className = 'select-group';
            group.innerHTML = `<label>${name}</label><select id="sel${i}" onchange="updateSelection(${i})"><option value="">-- SELECCIONAR --</option></select>`;
            grid.appendChild(group);

            const select = document.getElementById(`sel${i}`);
            playlists[name].split('|').forEach(ch => {
                const [label, url] = ch.split(',');
                const opt = document.createElement('option');
                opt.value = url; opt.textContent = label;
                select.appendChild(opt);
            });
        });

        function updateSelection(idx) {
            Object.keys(playlists).forEach((_, i) => { if(i !== idx) document.getElementById(`sel${i}`).value = ""; });
            const activeSel = document.getElementById(`sel${idx}`);
            currentUrl = activeSel.value;
            document.getElementById('status').textContent = "LOCKED: " + activeSel.options[activeSel.selectedIndex].text;
        }

        function playNative() {
            if (!currentUrl) return;
            document.getElementById('interactionShield').style.display = 'flex';
            if (hls) hls.destroy();
            if (Hls.isSupported()) {
                hls = new Hls({maxBufferLength: 30});
                hls.loadSource(currentUrl);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
            } else {
                video.src = currentUrl;
                video.play().catch(() => document.getElementById('status').textContent = "ERROR: USE VLC");
            }
        }

        function unlockVideo() {
            document.getElementById('interactionShield').style.display = 'none';
            video.play();
        }

        function openVLC() {
            if (currentUrl) window.location.href = "vlc://" + currentUrl;
        }
    </script>
</body>
</html>
