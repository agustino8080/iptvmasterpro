<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ULTRA IPTV PORTAL PRO</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-purple: #bc13fe;
            --neon-green: #39ff14;
            --bg-dark: #020617;
            --glass: rgba(15, 23, 42, 0.8);
            --text-glow: 0 0 10px rgba(0, 243, 255, 0.5);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Orbitron', 'Segoe UI', sans-serif;
            background-color: var(--bg-dark);
            background-image:
                radial-gradient(at 0% 0%, rgba(188, 19, 254, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(0, 243, 255, 0.15) 0px, transparent 50%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        .container {
            width: 95%;
            max-width: 1300px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            text-align: center;
        }

        .logo {
            width: 70px;
            height: 70px;
            filter: drop-shadow(0 0 15px var(--neon-cyan));
            animation: pulse 2s infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(1); opacity: 0.8; }
            to { transform: scale(1.1); opacity: 1; }
        }

        h1 {
            font-size: 1.4rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            color: var(--neon-cyan);
            text-shadow: var(--text-glow);
        }

        /* Controls Area */
        .controls-card {
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
        }

        .select-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 0.6rem;
            color: var(--neon-cyan);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-left: 5px;
        }

        select {
            width: 100%;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--neon-purple);
            color: #fff;
            padding: 8px;
            border-radius: 10px;
            font-size: 0.75rem;
            outline: none;
            cursor: pointer;
            font-family: inherit;
            transition: 0.3s;
        }

        select:focus { border-color: var(--neon-cyan); box-shadow: 0 0 10px rgba(0, 243, 255, 0.3); }
        select option { background: var(--bg-dark); color: #fff; }

        .action-area {
            grid-column: 1 / -1;
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.3s;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 1px;
            color: white;
        }

        .btn-native { background: linear-gradient(45deg, #1e40af, #3b82f6); }
        .btn-vlc { background: linear-gradient(45deg, #ea580c, #f97316); }

        .btn:hover { transform: scale(1.02); filter: brightness(1.2); }

        /* Player Area */
        .player-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid var(--neon-cyan);
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.2);
        }

        video { width: 100%; height: 100%; }

        .status-bar {
            background: rgba(0, 0, 0, 0.8);
            padding: 8px 20px;
            border-radius: 10px;
            font-size: 0.7rem;
            color: var(--neon-cyan);
            border: 1px solid rgba(0, 243, 255, 0.3);
            text-align: center;
        }

        @media (max-width: 600px) {
            .action-area { flex-direction: column; }
            .controls-card { grid-template-columns: 1fr; }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>

        function populate(id, data) {
            const el = document.getElementById(id);
            const items = data.split('|');
            items.forEach(item => {
                const parts = item.split(',');
                if (parts.length < 2) return;
                const opt = document.createElement('option');
                opt.value = parts[1].trim();
                opt.textContent = parts[0].trim();
                el.appendChild(opt);
            });
        }

        Object.keys(playlists).forEach(key => populate(key + 'Select', playlists[key]));

        let hls;
        const video = document.getElementById('video');
        let currentUrl = "";
        const selects = ['intlSelect', 'itSelect', 'it2Select', 'latSelect', 'lat2Select', 'lat3Select', 'lat4Select', 'lat6Select'];

        function updateSelection(type) {
            selects.forEach(s => { if (!s.startsWith(type)) document.getElementById(s).value = ""; });
            const activeSelect = document.getElementById(type + 'Select');
            currentUrl = activeSelect.value;
            document.getElementById('status').textContent = "SYSTEM LOCKED ON: " + activeSelect.options[activeSelect.selectedIndex].text;
        }

        function playNative() {
            if (!currentUrl) return;
            document.getElementById('status').textContent = "INITIALIZING STREAM...";
            if (hls) hls.destroy();
            if (Hls.isSupported()) {
                hls = new Hls({maxBufferLength: 30, enableWorker: true});
                hls.loadSource(currentUrl);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
                hls.on(Hls.Events.ERROR, (event, data) => { if(data.fatal) hls.recoverMediaError(); });
            } else {
                video.src = currentUrl;
                video.play().catch(e => { document.getElementById('status').textContent = "DEVICE NOT SUPPORTED. USE VLC."; });
            }
        }

        function openVLC() {
            if (!currentUrl) return;
            window.location.href = "vlc://" + currentUrl;
        }
