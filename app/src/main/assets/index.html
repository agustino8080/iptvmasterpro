<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>SEÑAL — Centro Multimedia</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.15/hls.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.min.js"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0A0D12; --bg-raised:#12161D; --bg-inset:#0D1016; --line:#222834; --line-soft:#1A1F28;
    --amber:#F5A623; --amber-dim:#96671E; --amber-glow:rgba(245,166,35,.35);
    --teal:#35D0BA; --teal-glow:rgba(53,208,186,.35); --text:#E7E4DC; --text-muted:#8B93A3;
    --text-dim:#4B525F; --live:#E5484D; --radius:10px;
    --font-display:'Bebas Neue', sans-serif; --font-head:'Oswald', sans-serif;
    --font-body:'IBM Plex Sans', sans-serif; --font-mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%; margin:0;}
  body{
    background: radial-gradient(ellipse 120% 80% at 15% -10%, rgba(245,166,35,.06), transparent 55%), var(--bg);
    color:var(--text); font-family:var(--font-body); -webkit-font-smoothing:antialiased; overflow:hidden;
  }
  .app{ height:100vh; display:grid; grid-template-rows:auto 1fr; }
  header.topbar{
    display:flex; align-items:center; gap:14px; padding:10px 18px;
    border-bottom:1px solid var(--line-soft); background:linear-gradient(180deg, var(--bg-raised), var(--bg));
  }
  .brand h1{ font-family:var(--font-display); font-size:26px; letter-spacing:.06em; margin:0; color:var(--text); }
  .brand h1 span{color:var(--amber);}

  .layout{ display:grid; grid-template-columns:320px 1fr; min-height:0; }
  aside.sidebar{ border-right:1px solid var(--line-soft); background:var(--bg-raised); overflow-y:auto; }
  .panel{ padding:16px; display:flex; flex-direction:column; gap:14px; }

  .btn{
    display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line);
    background:var(--bg-inset); color:var(--text); font-family:var(--font-head);
    font-size:12px; text-transform:uppercase; padding:10px 15px; border-radius:8px; cursor:pointer;
  }
  .btn-primary{ background:var(--amber); color:#1A1204; border-color:var(--amber); font-weight:600; }

  select.tuner-select{
    width:100%; background:var(--bg-inset); border:1px solid var(--line); color:white;
    padding:10px; border-radius:8px; font-size:13px; outline:none; appearance:none;
  }

  .current-channel-card{
    display:flex; align-items:center; gap:10px; border:1px solid var(--line);
    border-radius:9px; padding:10px; background:var(--bg-inset);
  }
  .info .cc-name{ font-family:var(--font-head); font-size:14px; color:var(--amber); }

  /* BOTONES EXTERNOS */
  .external-actions{ display:flex; gap:8px; margin-top:5px; }
  .btn-ext{ flex:1; font-size:10px; padding:8px; justify-content:center; }
  .btn-vlc{ border-color:var(--amber-dim); color:var(--amber); }
  .btn-nat{ border-color:var(--teal); color:var(--teal); }

  main.stage{ background:#000; position:relative; }
  video{ width:100%; height:100%; object-fit:contain; }

  @media(max-width:880px){ .layout{ grid-template-columns:1fr; } aside.sidebar{ display:none; } }
</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="brand"><h1>SE<span>Ñ</span>AL</h1></div>
    <button class="btn" id="openImport" style="margin-left:auto;"><i class="fas fa-plus"></i> Lista</button>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="panel">
        <select class="tuner-select" id="groupSelect"><option value="">Cargando grupos...</option></select>
        <select class="tuner-select" id="channelSelect"><option value="">Selecciona canal...</option></select>

        <div class="current-channel-card">
          <div class="info">
            <div class="cc-name" id="displayChannelName">Sin Canal</div>
            <div class="cc-meta">Streaming Pro</div>
          </div>
        </div>

        <div class="external-actions">
           <button class="btn btn-ext btn-nat" onclick="openNative()"><i class="fas fa-play"></i> NATIVO</button>
           <button class="btn btn-ext btn-vlc" onclick="openVLC()"><i class="fas fa-external-link-alt"></i> VLC</button>
        </div>

        <button class="btn btn-primary" onclick="playInternal()" style="margin-top:10px;">REPRODUCIR AQUÍ</button>
      </div>
    </aside>

    <main class="stage">
      <video id="video" controls autoplay playsinline></video>
    </main>
  </div>
</div>

<div id="importModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:1000; padding:20px;">
    <div style="background:var(--bg-raised); padding:20px; border-radius:15px; max-width:400px; margin:auto;">
        <h3>Pegar URL M3U</h3>
        <input type="text" id="urlInput" placeholder="http://..." style="width:100%; padding:10px; margin:10px 0;">
        <button class="btn btn-primary" onclick="loadUrl()">CARGAR LISTA</button>
        <button class="btn" onclick="document.getElementById('importModal').style.display='none'">CERRAR</button>
    </div>
</div>

<script>
  let channels = [];
  let currentUrl = "";
  let hls;
  const video = document.getElementById('video');

  // Recuperar lista guardada
  window.onload = () => {
    const saved = localStorage.getItem('playlist');
    if(saved) {
        channels = JSON.parse(saved);
        populateGroups();
    }
  };

  document.getElementById('openImport').onclick = () => document.getElementById('importModal').style.display = 'block';

  async function loadUrl() {
    const url = document.getElementById('urlInput').value;
    const res = await fetch(url);
    const text = await res.text();
    parseM3U(text);
    document.getElementById('importModal').style.display = 'none';
  }

  function parseM3U(text) {
    const lines = text.split('\n');
    channels = [];
    let name = "";
    lines.forEach(line => {
        if(line.startsWith('#EXTINF')) name = line.split(',')[1];
        else if(line.startsWith('http')) {
            channels.push({name: name || "Canal", url: line.trim()});
            name = "";
        }
    });
    localStorage.setItem('playlist', JSON.stringify(channels));
    populateGroups();
  }

  function populateGroups() {
    const sel = document.getElementById('channelSelect');
    sel.innerHTML = "";
    channels.forEach((c, i) => {
        const opt = document.createElement('option');
        opt.value = c.url; opt.textContent = c.name;
        sel.appendChild(opt);
    });
    document.getElementById('groupSelect').innerHTML = "<option>General ("+channels.length+")</option>";
  }

  document.getElementById('channelSelect').onchange = (e) => {
    currentUrl = e.target.value;
    document.getElementById('displayChannelName').textContent = e.target.options[e.target.selectedIndex].text;
    playInternal();
  };

  function playInternal() {
    if(!currentUrl) return;
    if(hls) hls.destroy();
    if(Hls.isSupported()) {
        hls = new Hls();
        hls.loadSource(currentUrl);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
    } else {
        video.src = currentUrl;
        video.play();
    }
  }

  function openVLC() {
    if(currentUrl) window.location.href = "vlc://" + currentUrl;
  }

  function openNative() {
    if(currentUrl) window.location.href = "play://" + currentUrl;
  }
</script>
</body>
</html>
