<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ULTRA IPTV HUB MAESTRO</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-purple: #bc13fe;
            --bg-dark: #020617;
            --glass: rgba(15, 23, 42, 0.85);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 50% 50%, #1e1b4b 0%, #020617 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container { width: 95%; max-width: 1400px; padding: 15px; display: flex; flex-direction: column; gap: 15px; }

        header { text-align: center; padding: 10px; border-bottom: 2px solid var(--neon-cyan); box-shadow: 0 0 20px rgba(0,243,255,0.2); border-radius: 15px; background: var(--glass); }
        h1 { font-size: 1.2rem; letter-spacing: 3px; color: var(--neon-cyan); text-transform: uppercase; }

        /* Grid de Selects */
        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 12px;
            background: var(--glass);
            padding: 20px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .select-group { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 0.6rem; color: var(--neon-cyan); text-transform: uppercase; font-weight: bold; margin-left: 5px; }

        select {
            width: 100%;
            background: rgba(0,0,0,0.6);
            border: 1px solid var(--neon-purple);
            color: #fff;
            padding: 8px;
            border-radius: 10px;
            font-size: 0.75rem;
            outline: none;
            cursor: pointer;
        }
        select:focus { border-color: var(--neon-cyan); }

        .action-area {
            grid-column: 1 / -1;
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }

        .btn {
            flex: 1; padding: 12px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px; color: white; text-transform: uppercase; font-size: 0.75rem;
        }
        .btn-native { background: linear-gradient(45deg, #1e40af, #3b82f6); }
        .btn-vlc { background: linear-gradient(45deg, #ea580c, #f97316); }

        /* Player Area */
        .player-wrapper {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid var(--neon-cyan);
            position: relative;
        }
        video { width: 100%; height: 100%; }

        #status {
            background: rgba(0,0,0,0.5);
            padding: 8px;
            border-radius: 8px;
            font-size: 0.7rem;
            color: var(--neon-cyan);
            text-align: center;
        }

        #interactionShield {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10;
            background: rgba(0,0,0,0.01); cursor: pointer; display: none;
        }
        .unlock-btn {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: var(--neon-cyan); color: #000; padding: 12px 20px; border-radius: 50px; font-weight: bold;
        }

        @media (max-width: 600px) { h1 { font-size: 1rem; } .action-area { flex-direction: column; } }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1><i class="fas fa-microchip"></i> ULTRA IPTV MASTER HUB</h1>
    </header>

    <div class="controls-grid" id="masterGrid">
        <!-- Generado dinámicamente -->
    </div>

    <div id="status">SISTEMA LISTO. ELIGE UNA FUENTE.</div>

    <div class="player-wrapper">
        <div id="interactionShield" onclick="this.style.display='none'">
            <div class="unlock-btn"><i class="fas fa-play"></i> INICIAR SEÑAL</div>
        </div>
        <video id="video" controls autoplay playsinline></video>
    </div>

    <div class="action-area">
        <button class="btn btn-native" onclick="playNative()"><i class="fas fa-play"></i> REPRODUCIR</button>
        <button class="btn btn-vlc" onclick="openVLC()"><i class="fas fa-external-link-alt"></i> ABRIR EN VLC</button>
    </div>
</div>

<script>
    const playlists = {
        "Icelanders World": `ABC,abc-usa|A&E,a-e|AMC,amc|Animal Planet,animal-planet|BBC America,bbc-america|BBC One,bbc-one-london|BBC Two,bbc-two|beIN Sports,beinsports-usa|Bravo,bravo|Boomerang,boomerang|Cartoon Network,cartoon-network|CBeebies,cbeebies|CBS,cbs|CNBC,cnbc|Comedy Central,comedy-central|CW,the-cw|Discovery,discovery-channel|Discovery Turbo,discovery-turbo|Food Network,food-network|Fox USA,fox-usa|Fox Deportes,fox-deportes|FX,fx|FXM,fxm|FXX,fxx|Freeform,freeform|HBO,hbo-usa|HBO Latino,hbolatino-usa|HBO Comedy,hbocomedy-usa|HBO Drama,hbodrama-usa|HBO Signature,hbosignature-usa|HGTV,hgtv|MTV,mtv|NBC,nbc|Showtime,showtime-usa|STARZ,starz|SYFY,syfy|TBS,tbs|Telemundo,telemundo|TNT,tnt|TruTV,trutv|USA Network,usa-network|WAPA,wapa-america|ACC Network,acc-network|UFC Fight Pass,ufc-fight-pass|Willow Cricket,willow-cricket`,

        "Italy Icelanders": `Rai 1,rai-1|Rai 2,rai-2|Rai 3,rai-3|Rete 4,rete-4|Canale 5,canale-5|Italia 1,italia-1|TV8,tv8|NOVE,nove|Rai 4,rai-4|Iris,iris|Sky Uno,sky-uno|Sky TG24,sky-tg24|Sky Sport Football,sky-sports-football|Sky Sport F1,sky-sports-f1`,

        "Test 45.181 (Lat)": `BabyFirst,http://45.181.121.85:25461/test/test/2|Cartoon Network,http://45.181.121.85:25461/test/test/4|Nickelodeon,http://45.181.121.85:25461/test/test/5|Disney Channel,http://45.181.121.85:25461/test/test/8|AMC Series,http://45.181.121.85:25461/test/test/24|BBC NEWS,http://45.181.121.85:25461/test/test/25|AXN,http://45.181.121.85:25461/test/test/32|ESPN 2,http://45.181.121.85:25461/test/test/66|HBO,http://45.181.121.85:25461/test/test/100|TNT Sports,http://45.181.121.85:25461/test/test/147`,

        "Test 45.122 (HD)": `A&E HD,http://45.181.122.46:8090/play/a00d|AMC HD,http://45.181.122.46:8090/play/a027|AXN HD,http://45.181.122.46:8090/play/a00g|CHV HD,http://45.181.122.46:8090/play/a01o|ESPN 2 HD,http://45.181.122.46:8090/play/a01v|HBO HD,http://45.181.122.46:8090/play/a029|Sony HD,http://45.181.122.46:8090/play/a00e|Warner HD,http://45.181.122.46:8090/play/a00f`,

        "Euro Signals (5.180)": `3SAT,http://5.180.164.197:8080/3SAT/index.m3u8|BLOOMBERG,http://5.180.164.197:8080/BLOOMBERG/index.m3u8|CNN,http://5.180.164.197:8080/CNN/index.m3u8|RTL,http://5.180.164.197:8080/RTL/index.m3u8|ZDF,http://5.180.164.197:8080/ZDF/index.m3u8|SKY NEWS,http://5.180.164.197:8080/SKYNEWS/index.m3u8`,

        "Latino VIP (190.83)": `Animal Planet,http://190.83.85.68/animal_planet/index.m3u8|AXN,http://190.83.85.68/axn/index.m3u8|HBO,http://190.83.85.68/hbo/index.m3u8|ESPN,http://190.83.85.68/espn/index.m3u8|TNT,http://190.83.85.68/tnt/index.m3u8|Globo,http://190.83.85.68/globo/index.m3u8|TUDN,http://190.83.2.182:8090/TUDN/index.m3u8`,

        "Latino 2 HD (45.190)": `AnimalPlanet HD,http://45.190.13.8/AnimalPlanetHD/index.m3u8|AXN HD,http://45.190.13.8/AXNHD/index.m3u8|NatGeo HD,http://45.190.13.8/NatGeoHD/index.m3u8|Universal TV,http://45.190.13.8/UniversalTV/index.m3u8|Multipremier,http://45.190.13.8/Multipremier/index.m3u8`,

        "Latino 3 (Mixed)": `BTV,http://103.165.93.31:8095/btv/index.m3u8|SABC 3,http://195.128.27.177/SABC3/index.m3u8|AMC HD,http://45.235.37.228/amchd/index.m3u8|Boing,http://185.47.212.25/Boing/index.m3u8|SBT,http://200.77.176.130/SBT/index.m3u8`,

        "Global 179 (OLE)": `A&E HD,http://179.63.6.209:8000/play/a006|ESPN 6 HD,http://179.63.6.209:8000/play/a095|HBO FAMILY,http://179.63.6.209:8000/play/a00p|LIGA 1 MAX,http://179.63.6.209:8000/play/a0cr|WILLAX HD,http://179.63.5.46:8000/play/a06e/index.m3u8|TYC SPORTS HD,http://179.63.5.46:8000/play/a04f/index.m3u8`,

        "Pro 186 (Special)": `24 HORAS,http://186.148.196.250:81/play/a0no/index.m3u8|AMC HD,http://186.148.196.250:81/play/a0ii/index.m3u8|GOLPERU HD,http://186.148.196.82:8001/play/golperu|LIGA 1 MAX,http://186.148.196.82:8001/play/ligamax1|TyC Sports HD,http://186.148.196.82:8001/play/a0ar`
    };

    const grid = document.getElementById('masterGrid');
    let currentUrl = "";
    let hls;
    const video = document.getElementById('video');

    // Inicializar Selects
    Object.keys(playlists).forEach((name, idx) => {
        const group = document.createElement('div');
        group.className = 'select-group';
        group.innerHTML = `<label>${name}</label><select id="select${idx}" onchange="updateMaster(${idx})"><option value="">-- ELIGE --</option></select>`;
        grid.appendChild(group);

        const sel = document.getElementById(`select${idx}`);
        playlists[name].split('|').forEach(item => {
            const [label, url] = item.split(',');
            const opt = document.createElement('option');
            opt.value = url.includes('http') ? url : `https://logic.icelanders.st/embed/${url}`;
            opt.textContent = label;
            sel.appendChild(opt);
        });
    });

    function updateMaster(activeIdx) {
        for(let i=0; i<10; i++) {
            if(i !== activeIdx) document.getElementById(`select${i}`).value = "";
        }
        const activeSel = document.getElementById(`select${activeIdx}`);
        currentUrl = activeSel.value;
        document.getElementById('status').textContent = "SELECCIONADO: " + activeSel.options[activeSel.selectedIndex].text;
    }

    function playNative() {
        if (!currentUrl) return;
        document.getElementById('status').textContent = "SINCRONIZANDO...";
        document.getElementById('interactionShield').style.display = 'block';
        if (hls) hls.destroy();
        if (Hls.isSupported()) {
            hls = new Hls({maxBufferLength: 30});
            hls.loadSource(currentUrl);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
            hls.on(Hls.Events.ERROR, (e,data) => { if(data.fatal) hls.recoverMediaError(); });
        } else {
            video.src = currentUrl;
            video.play().catch(() => { document.getElementById('status').textContent = "ERROR: USA VLC"; });
        }
    }

    function openVLC() {
        if (!currentUrl) return;
        window.location.href = "vlc://" + currentUrl;
    }
</script>
</body>
</html>
