<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xtream Universal Extractor</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#00f2ff">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --primary: #00f2ff; --bg: #050a14; --card: #101827; --text: #ffffff; --accent: #7000ff; --success: #10b981; --danger: #ef4444; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: radial-gradient(circle at top, #1e1b4b, var(--bg)); color: var(--text); margin: 0; padding: 15px; min-height: 100vh; }
        .container { max-width: 1000px; margin: 0 auto; }
        .header { text-align: center; padding: 20px; background: linear-gradient(90deg, var(--accent), var(--primary)); border-radius: 15px; margin-bottom: 20px; box-shadow: 0 0 20px rgba(0, 242, 255, 0.3); }
        .header h1 { margin: 0; font-size: 1.8rem; text-transform: uppercase; letter-spacing: 2px; }

        .input-card { background: var(--card); padding: 20px; border-radius: 15px; border: 1px solid #1e293b; margin-bottom: 20px; }
        input, select { width: 100%; background: #0b0f1a; border: 1px solid #334155; color: white; padding: 15px; border-radius: 10px; font-size: 1rem; outline: none; margin-bottom: 10px; }
        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }
        button, .install-btn { flex: 1; min-width: 150px; background: var(--primary); color: #000; border: none; padding: 15px; border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        button:hover, .install-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0, 242, 255, 0.4); }

        .btn-save { background: var(--success); color: white; }
        .install-btn { background: #10b981; color: white; margin-top: 10px; display: none; }

        .status { text-align: center; padding: 12px; border-radius: 8px; margin-bottom: 15px; display: none; font-weight: 600; }
        .status.error { display: block; background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid #ef4444; }
        .status.info { display: block; background: rgba(0, 242, 255, 0.1); color: var(--primary); border: 1px solid var(--primary); }

        /* Historial de Links */
        .history-section { background: var(--card); padding: 15px; border-radius: 15px; margin-bottom: 20px; border: 1px solid #1e293b; }
        .history-title { font-size: 0.9rem; color: var(--primary); font-weight: bold; margin-bottom: 10px; text-transform: uppercase; }
        .history-controls { display: flex; gap: 10px; flex-wrap: wrap; }
        .history-select { flex: 1; min-width: 200px; margin-bottom: 0; }
        .action-btn { background: #1e293b; border: 1px solid #334155; color: white; padding: 10px 15px; border-radius: 10px; cursor: pointer; font-size: 0.9rem; transition: 0.2s; display: flex; align-items: center; gap: 5px; }
        .action-btn:hover { background: #334155; border-color: var(--primary); }
        .action-btn.del:hover { border-color: var(--danger); color: var(--danger); }

        .direct-play-box { background: #1e293b; padding: 15px; border-radius: 10px; margin-bottom: 20px; border-left: 5px solid #10b981; display: none; }
        .app-grid { display: grid; grid-template-columns: 260px 1fr; gap: 20px; display: none; }
        .sidebar { background: var(--card); border-radius: 12px; padding: 15px; height: 65vh; overflow-y: auto; border: 1px solid #1e293b; }
        .cat-btn { padding: 12px; cursor: pointer; border-radius: 8px; margin-bottom: 6px; font-size: 0.9rem; transition: 0.2s; border-left: 3px solid transparent; }
        .cat-btn:hover, .cat-btn.active, .cat-btn:focus { background: rgba(0, 242, 255, 0.1); border-left-color: var(--primary); color: var(--primary); outline: 2px solid var(--primary); }

        .player-wrap { position: sticky; top: 0; background: #000; border-radius: 12px; overflow: hidden; margin-bottom: 20px; border: 2px solid var(--primary); }
        video { width: 100%; aspect-ratio: 16/9; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
        .item { background: var(--card); padding: 12px; border-radius: 8px; text-align: center; cursor: pointer; font-size: 0.8rem; border: 1px solid #1e293b; transition: 0.2s; }
        .item:hover, .item:focus { border-color: var(--primary); transform: scale(1.03); outline: 2px solid var(--primary); }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1><i class="fas fa-play-circle"></i> UNIVERSAL XTREAM EXTRACTOR</h1>
    </div>

    <div class="input-card">
        <input type="text" id="urlInput" placeholder="Pega el enlace Xtream..." value="">
        <div class="btn-group">
            <button onclick="analyze(true)"><i class="fas fa-tv"></i> CARGAR TV</button>
            <button onclick="analyze(false)" style="background:var(--accent); color:white;"><i class="fas fa-film"></i> CARGAR CINE</button>
            <button onclick="saveCurrentLink()" class="btn-save"><i class="fas fa-save"></i> GUARDAR LINK</button>
        </div>
        <button id="installBtn" class="install-btn"><i class="fas fa-download"></i> INSTALAR APP EN ESTE EQUIPO</button>
    </div>

    <div id="status" class="status"></div>

    <!-- Sección de Links Guardados (Ahora en Select) -->
    <div class="history-section" id="historySection" style="display: none;">
        <div class="history-title">Mis Enlaces Guardados</div>
        <div class="history-controls">
            <select id="historySelect" class="history-select"></select>
            <button class="action-btn" onclick="loadSelectedFromHistory()"><i class="fas fa-upload"></i> Cargar</button>
            <button class="action-btn" onclick="copySelectedFromHistory()"><i class="fas fa-copy"></i> Copiar</button>
            <button class="action-btn del" onclick="deleteSelectedFromHistory()"><i class="fas fa-trash"></i> Borrar</button>
        </div>
    </div>

    <div id="directBox" class="direct-play-box">
        <p><strong><i class="fas fa-check-circle"></i> Enlace directo detectado</strong></p>
        <button onclick="playDirect()" style="margin-top:10px; background:#10b981; color:white;">REPRODUCIR AHORA</button>
    </div>

    <div class="app-grid" id="app">
        <div class="sidebar" id="cats"></div>
        <div class="main">
            <div class="player-wrap">
                <video id="player" controls autoplay playsinline></video>
            </div>
            <div id="content" class="grid"></div>
        </div>
    </div>
</div>

<script>
    const PROXY = "https://proxy-sage-nine-88.vercel.app/api/proxy?url=";
    const HISTORY_KEY = 'xtream_links_history';
    let server, user, pass, hls;
    let allData = [];

    // --- PWA Logic ---
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        document.getElementById('installBtn').style.display = 'flex';
    });

    document.getElementById('installBtn').addEventListener('click', async () => {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') document.getElementById('installBtn').style.display = 'none';
            deferredPrompt = null;
        }
    });

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('service-worker.js').catch(() => {});
    }

    // --- History Logic ---
    function saveCurrentLink() {
        const url = document.getElementById('urlInput').value.trim();
        if (!url) return;

        let history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
        if (history.includes(url)) {
            alert("Este enlace ya está guardado.");
            return;
        }

        history.push(url);
        localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
        renderHistory();
        alert("Enlace guardado.");
    }

    function renderHistory() {
        const history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
        const container = document.getElementById('historySection');
        const select = document.getElementById('historySelect');

        if (history.length === 0) {
            container.style.display = 'none';
            return;
        }

        container.style.display = 'block';
        select.innerHTML = '';

        history.forEach((url, index) => {
            const option = document.createElement('option');
            option.value = index;
            option.textContent = url;
            select.appendChild(option);
        });
    }

    function loadSelectedFromHistory() {
        const select = document.getElementById('historySelect');
        if (select.value === "") return;
        const history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
        document.getElementById('urlInput').value = history[select.value];
        analyze(true);
    }

    function copySelectedFromHistory() {
        const select = document.getElementById('historySelect');
        if (select.value === "") return;
        const history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
        navigator.clipboard.writeText(history[select.value]);
        alert("Enlace copiado al portapapeles.");
    }

    function deleteSelectedFromHistory() {
        const select = document.getElementById('historySelect');
        if (select.value === "") return;
        if (!confirm("¿Seguro que quieres borrar este enlace?")) return;

        let history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
        history.splice(select.value, 1);
        localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
        renderHistory();
    }

    // --- Core Logic ---
    function setStatus(msg, type='info') {
        const s = document.getElementById('status');
        if (!msg) { s.style.display = 'none'; return; }
        s.innerHTML = msg; s.className = 'status ' + type;
        s.style.display = 'block';
    }

    function analyze(isLive) {
        const raw = document.getElementById('urlInput').value.trim();
        if (!raw) return;

        if (raw.match(/\.(mkv|mp4|ts|avi|m3u8)/i)) {
            document.getElementById('directBox').style.display = 'block';
        } else {
            document.getElementById('directBox').style.display = 'none';
        }

        try {
            const url = new URL(raw.startsWith('http') ? raw : 'http://' + raw);
            server = url.origin;
            const parts = url.pathname.split('/').filter(Boolean);
            let startIndex = 0;
            if (['live','movie','series'].includes(parts[0])) startIndex = 1;

            user = parts[startIndex];
            pass = parts[startIndex + 1];

            if (!user || !pass) throw new Error();
            loadLibrary(isLive);
        } catch(e) {
            setStatus("❌ URL inválida. Revisa servidor, usuario y pass.", "error");
        }
    }

    async function loadLibrary(isLive) {
        document.getElementById('app').style.display = 'none';
        setStatus("<i class='fas fa-sync fa-spin'></i> Conectando al servidor...");

        const actionCat = isLive ? 'get_live_categories' : 'get_vod_categories';
        const actionStream = isLive ? 'get_live_streams' : 'get_vod_streams';
        const apiBase = `${server}/player_api.php?username=${user}&password=${pass}`;

        try {
            const [cRes, sRes] = await Promise.all([
                fetch(PROXY + encodeURIComponent(apiBase + "&action=" + actionCat)),
                fetch(PROXY + encodeURIComponent(apiBase + "&action=" + actionStream))
            ]);

            const categories = await cRes.json();
            allData = await sRes.json();

            if (!Array.isArray(allData)) throw new Error();

            render(categories, isLive);
            document.getElementById('app').style.display = 'grid';
            setStatus("✅ Datos cargados correctamente.", "info");
            setTimeout(() => setStatus(""), 3000);
        } catch(err) {
            setStatus("❌ El servidor IPTV o el proxy rechazaron la conexión.", "error");
        }
    }

    function render(cats, isLive) {
        const side = document.getElementById('cats');
        side.innerHTML = `<h3>${isLive ? 'TV' : 'CINE'}</h3>`;
        cats.forEach(c => {
            const d = document.createElement('div');
            d.className = 'cat-btn';
            d.tabIndex = 0;
            d.textContent = c.category_name;
            d.onclick = () => {
                document.querySelectorAll('.cat-btn').forEach(x => x.classList.remove('active'));
                d.classList.add('active');
                renderItems(c.category_id, isLive);
            };
            side.appendChild(d);
        });
        if (cats.length > 0) side.children[1].click();
    }

    function renderItems(id, isLive) {
        const box = document.getElementById('content');
        box.innerHTML = '';
        const filtered = allData.filter(i => i.category_id == id);
        const type = isLive ? 'live' : 'movie';
        const ext = isLive ? '.m3u8' : '';

        filtered.forEach(item => {
            const d = document.createElement('div');
            d.className = 'item';
            d.tabIndex = 0;
            d.textContent = item.name;
            d.onclick = () => {
                const finalExt = !isLive && item.container_extension ? "." + item.container_extension : ext;
                play(`${server}/${type}/${user}/${pass}/${item.stream_id}${finalExt}`);
            };
            box.appendChild(d);
        });
    }

    function play(url) {
        const video = document.getElementById('player');
        if (hls) { hls.destroy(); hls = null; }
        video.pause();
        video.removeAttribute('src');
        video.load();

        if (url.includes('.m3u8') && Hls.isSupported()) {
            hls = new Hls({
                maxBufferLength: 30,
                maxMaxBufferLength: 60,
                enableWorker: true
            });
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));

            hls.on(Hls.Events.ERROR, (event, data) => {
                if (data.fatal) {
                    switch (data.type) {
                        case Hls.ErrorTypes.NETWORK_ERROR: hls.startLoad(); break;
                        case Hls.ErrorTypes.MEDIA_ERROR: hls.recoverMediaError(); break;
                        default: play(url); break;
                    }
                }
            });
        } else {
            video.src = url;
            video.play().catch(() => {
                alert("Error al reproducir. Algunos formatos como MKV no son compatibles con navegadores. Usa VLC.");
                window.location.href = "vlc://" + url;
            });
        }
        window.scrollTo({top: 0, behavior: 'smooth'});
    }

    function playDirect() {
        play(document.getElementById('urlInput').value.trim());
    }

    // Inicializar historial
    window.onload = renderHistory;
</script>
</body>
</html>
